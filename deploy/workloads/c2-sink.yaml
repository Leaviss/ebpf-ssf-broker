# Trial harness — dummy C2 sink for scenario 2 (egress).
#
# A plain TCP listener on the well-known lab port 9666 (nothing legitimate uses
# it — see tracingpolicy-egress.yaml). Service A's simulated C2 callback connects
# here; the egress TracingPolicy matches DPort 9666 and emits the event. The sink
# only needs to accept the connection so the client's `wget` completes cleanly.
#
# NOT a mesh workload: sidecar injection is disabled so this stays a plain
# "external" sink. Envoy in Service A's pod reaches it via the passthrough
# cluster (ALLOW_ANY outbound), and the observable tcp_connect is Envoy's
# upstream connect to :9666 (see ../tetragon/README.md) — which still
# carries Service A's pod metadata, all the translator needs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c2-sink
  namespace: zta-ssf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-sink
  namespace: zta-ssf
  labels:
    app: c2-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c2-sink
  template:
    metadata:
      labels:
        app: c2-sink
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: c2-sink
      containers:
        - name: sink
          image: busybox:1.36
          # Accept a connection, hand back a minimal HTTP 200 so a wget-based
          # callback exits 0, then loop for the next callback. -lk would keep the
          # socket open; the loop keeps the response deterministic per trial.
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "c2-sink listening on :9666"
              while true; do
                printf 'HTTP/1.1 200 OK\r\nContent-Length: 6\r\nConnection: close\r\n\r\npwned\n' | nc -l -p 9666
              done
          ports:
            - containerPort: 9666
---
apiVersion: v1
kind: Service
metadata:
  name: c2-sink
  namespace: zta-ssf
  labels:
    app: c2-sink
spec:
  selector:
    app: c2-sink
  ports:
    - name: c2
      port: 9666
      targetPort: 9666
