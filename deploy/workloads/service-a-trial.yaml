# Trial harness — busybox-variant of Service A: the attacker's vehicle.
#
# Service A's real image is distroless (no shell, nothing can exec), which is
# correct for the production workload but leaves an attacker no way to act inside
# the pod. This trial pod carries Service A's exact
# identity (same ServiceAccount + labels, so the selector-less ClusterSPIFFEID mints the
# SAME spiffe://example.org/ns/zta-ssf/sa/service-a  and the allow-a-to-b policy
# covers it) but runs busybox, giving a shell plus wget/nc/cat — the tools used to
# simulate the three scenarios (exec, C2 egress to :9666, SA-token read).
#
# Deliberately IDLE (no B-probing loop): the clean Go /app in service-a.yaml stays
# the prober so the "first request denied" latency signal is never contaminated by a
# busybox wget loop (which would itself trip emit-exec-service-a every iteration).
# One replica: the compromise runs here while the Go prober in service-a.yaml keeps
# exercising the A->B path from a pod of its own.
#
# Revocation is per-identity (docs/architecture.md): a deny on spiffe .../sa/service-a
# burns the Go prober AND this trial pod at once, which is the property
# under test.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-trial
  namespace: zta-ssf
  labels:
    app: service-a
    variant: trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
      variant: trial
  template:
    metadata:
      labels:
        app: service-a
        variant: trial
        spiffe.io/spire-managed-identity: "true"
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: service-a
      containers:
        - name: service-a
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo trial vehicle up; while true; do sleep 3600; done"]
          env:
            - name: TARGET_URL
              value: http://service-b.zta-ssf.svc.cluster.local:8080
